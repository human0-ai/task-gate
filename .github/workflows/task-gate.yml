name: Task Gate

# This repo runs its own gate, pinned to the released @v1 like every other
# consumer. The gate only acts on PRs opened by the Human0 app that link a task —
# PRs here are authored by people, so it passes through; this is a smoke test
# that the released action runs.
on:
  pull_request:
    # `edited` so adding the Task: link to the description re-runs the gate.
    types: [opened, synchronize, ready_for_review, edited, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id is the status-check name — `task-gate` so it matches the documented
  # required check.
  task-gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: task-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: human0-ai/task-gate@v1
        with:
          pr_number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          github_token: ${{ github.token }}
